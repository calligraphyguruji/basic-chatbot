<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84A"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
    <filter id="botShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#803e00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Saffron Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#saffronGrad)"/>

  <!-- Chatbot Mascot -->
  <g filter="url(#botShadow)">
    <!-- Antenna Top & Stem -->
    <circle cx="32" cy="11.5" r="3.5" fill="#FFFFFF"/>
    <line x1="32" y1="15" x2="32" y2="19.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Side Head Sensors / Ears -->
    <rect x="7" y="27" width="4.5" height="11" rx="2.25" fill="#FFFFFF"/>
    <rect x="52.5" y="27" width="4.5" height="11" rx="2.25" fill="#FFFFFF"/>

    <!-- Robot Head Outline -->
    <rect x="11.5" y="19" width="41" height="33" rx="9" fill="#FFFFFF"/>

    <!-- Screen Display Face -->
    <rect x="16.5" y="24" width="31" height="23" rx="6" fill="#FFF8F0"/>

    <!-- Chatbot Eyes -->
    <circle cx="25" cy="32.5" r="3.5" fill="#FF8800"/>
    <circle cx="39" cy="32.5" r="3.5" fill="#FF8800"/>

    <!-- Eye Glint Highlights -->
    <circle cx="26.3" cy="31.2" r="1.2" fill="#FFFFFF"/>
    <circle cx="40.3" cy="31.2" r="1.2" fill="#FFFFFF"/>

    <!-- Cheerful Chatbot Smile -->
    <path d="M26 39.5c1.8 2.3 4.2 2.6 6 2.6s4.2-.3 6-2.6" stroke="#FF8800" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>